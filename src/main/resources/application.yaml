spring:
  application:
    name: airbnbSearcher
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airbnb_db}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    socket-timeout: 30s
    connection-timeout: 30s

management:
  otlp:
    metrics:
      export:
        # Disabled by default — set to true and configure the endpoint
        # when an OpenTelemetry collector is available in your environment.
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318/v1/metrics}
