global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  scrape_native_histograms: true

otlp:
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - deployment.environment
    - cloud.availability_zone
    - cloud.region
    - container.name

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: airbnb-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - airbnb-app:8081
        labels:
          service: airbnbSearcher

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis

  - job_name: elasticsearch-exporter
    static_configs:
      - targets:
          - elasticsearch-exporter:9114
        labels:
          service: elasticsearch
