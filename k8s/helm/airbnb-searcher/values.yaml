# Global settings
global:
  domain: airbnb.local

# Frontend (UI) settings
ui:
  enabled: true
  image:
    repository: ghcr.io/<OWNER>/airbnb-searcher-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80

# Backend (MSVC) settings
msvc:
  enabled: true
  image:
    repository: ghcr.io/<OWNER>/airbnb-searcher-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
    managementPort: 8081
  env:
    POSTGRES_DB: airbnb_db
    POSTGRES_USER: user
    POSTGRES_PASSWORD: password
    SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-lgtm:4318

# PostgreSQL settings
postgres:
  enabled: true
  image: postgres:16-alpine
  password: password
  user: user
  database: airbnb_db
  persistence:
    enabled: true
    size: 1Gi

# Elasticsearch settings
elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
  persistence:
    enabled: true
    size: 2Gi

# Redis settings
redis:
  enabled: true
  image: redis:7-alpine

# Istio settings
istio:
  enabled: true
  gateway:
    name: airbnb-gateway
    selector:
      istio: ingressgateway
