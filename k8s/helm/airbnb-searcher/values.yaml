# Global settings
global:
  domain: airbnb.local
  imagePullSecrets: []

# Frontend (UI) settings
ui:
  enabled: true
  image:
    repository: ghcr.io/abhiroy96/airbnbsearcher-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80

# Backend (MSVC) settings
msvc:
  enabled: true
  image:
    repository: ghcr.io/abhiroy96/airbnbsearcher-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
    managementPort: 8081
  env:
    POSTGRES_DB: airbnb_db
    POSTGRES_USER: user
    POSTGRES_PASSWORD: password
    SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-lgtm.observability:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: otlp
    OTEL_TRACES_SAMPLER: always_on
    OTEL_METRIC_EXPORT_INTERVAL: 10000
    OTEL_PROPAGATORS: tracecontext,baggage
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=airbnb-searcher,deployment.environment=k8s
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_LOG_ATTRIBUTES: "true"
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "*"
    OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "true"
    OTEL_JAVAAGENT_DEBUG: "false"
    APP_LOG_LEVEL: INFO

# PostgreSQL settings
postgres:
  enabled: true
  image: postgres:16-alpine
  password: password
  user: user
  database: airbnb_db
  persistence:
    enabled: true
    size: 1Gi

# Elasticsearch settings
elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
  persistence:
    enabled: true
    size: 2Gi

# Redis settings
redis:
  enabled: true
  image: redis:7-alpine

# Metrics exporters
exporters:
  postgres:
    enabled: true
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
  redis:
    enabled: true
    image: oliver006/redis_exporter:v1.62.0
  elasticsearch:
    enabled: true
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0

# Istio settings
istio:
  enabled: true
  gateway:
    name: airbnb-gateway
    selector:
      istio: ingressgateway
  telemetry:
    accessLog:
      provider: envoy
    metrics:
      provider: prometheus
    tracing:
      provider: jaeger
      randomSamplingPercentage: 100
