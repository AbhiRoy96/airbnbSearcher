{{- if .Values.exporters.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
spec:
  ports:
    - name: http-metrics
      port: 9187
      targetPort: 9187
  selector:
    app: postgres-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: {{ .Values.exporters.postgres.image }}
          env:
            - name: DATA_SOURCE_NAME
              value: postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}?sslmode=disable
          ports:
            - containerPort: 9187
{{- end }}

{{- if .Values.exporters.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
spec:
  ports:
    - name: http-metrics
      port: 9121
      targetPort: 9121
  selector:
    app: redis-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
spec:
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: {{ .Values.exporters.redis.image }}
          env:
            - name: REDIS_ADDR
              value: redis://redis:6379
          ports:
            - containerPort: 9121
{{- end }}

{{- if .Values.exporters.elasticsearch.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-exporter
spec:
  ports:
    - name: http-metrics
      port: 9114
      targetPort: 9114
  selector:
    app: elasticsearch-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
spec:
  selector:
    matchLabels:
      app: elasticsearch-exporter
  template:
    metadata:
      labels:
        app: elasticsearch-exporter
    spec:
      containers:
        - name: elasticsearch-exporter
          image: {{ .Values.exporters.elasticsearch.image }}
          args:
            - --es.uri=http://elasticsearch:9200
            - --es.all
            - --es.indices
          ports:
            - containerPort: 9114
{{- end }}
