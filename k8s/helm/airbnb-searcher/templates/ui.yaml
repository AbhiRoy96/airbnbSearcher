{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: airbnb-ui
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: airbnb-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbnb-ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app: airbnb-ui
  template:
    metadata:
      labels:
        app: airbnb-ui
      {{- if .Values.istio.enabled }}
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          tracing:
            sampling: {{ .Values.istio.telemetry.tracing.randomSamplingPercentage }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: airbnb-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 80
{{- end }}
