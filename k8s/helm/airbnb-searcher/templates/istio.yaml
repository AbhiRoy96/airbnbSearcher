{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ .Values.istio.gateway.name }}
spec:
  selector:
    {{- toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.global.domain | quote }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: airbnb-ui
spec:
  hosts:
    - {{ .Values.global.domain | quote }}
  gateways:
    - {{ .Values.istio.gateway.name }}
  http:
    - match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: airbnb-msvc
            port:
              number: 8080
    - route:
        - destination:
            host: airbnb-ui
            port:
              number: 80
{{- end }}
