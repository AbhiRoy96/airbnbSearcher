apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-lgtm
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-lgtm
  template:
    metadata:
      labels:
        app: grafana-lgtm
    spec:
      containers:
        - name: grafana-lgtm
          image: grafana/otel-lgtm:latest
          ports:
            - containerPort: 3000
            - containerPort: 4317
            - containerPort: 4318
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          volumeMounts:
            - name: prometheus-config
              mountPath: /otel-lgtm/prometheus.yaml
              subPath: prometheus.yaml
            - name: prometheus-config
              mountPath: /otel-lgtm/prometheus/prometheus.yml
              subPath: prometheus.yaml
            - name: grafana-dashboards
              mountPath: /otel-lgtm/grafana/dashboards/airbnb
            - name: grafana-dashboards-provisioning
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/airbnb-dashboards.yaml
              subPath: airbnb-dashboards.yaml
            - name: grafana-alerts-provisioning
              mountPath: /otel-lgtm/grafana/conf/provisioning/alerting/airbnb-alerts.yaml
              subPath: airbnb-alerts.yaml
      volumes:
        - name: prometheus-config
          configMap:
            name: lgtm-prometheus-config
        - name: grafana-dashboards
          configMap:
            name: lgtm-grafana-dashboards
        - name: grafana-dashboards-provisioning
          configMap:
            name: lgtm-grafana-dashboards-provisioning
        - name: grafana-alerts-provisioning
          configMap:
            name: lgtm-grafana-alerts-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-lgtm
  namespace: observability
spec:
  selector:
    app: grafana-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
