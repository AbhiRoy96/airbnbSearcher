services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    networks:
      - app-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d airbnb_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./msvc/init-db:/docker-entrypoint-initdb.d

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
    container_name: elasticsearch
    networks:
      - app-net
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    networks:
      - app-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    networks:
      - app-net
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    networks:
      - app-net
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: elasticsearch-exporter
    networks:
      - app-net
    command:
      - --es.uri=http://elasticsearch:9200
      - --es.all
      - --es.indices
    depends_on:
      elasticsearch:
        condition: service_healthy

  app:
    build: ./msvc
    container_name: airbnb-app
    networks:
      - app-net
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_ELASTICSEARCH_URIS=${SPRING_ELASTICSEARCH_URIS}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - JAVA_OPTS=-Xmx512m -Xms256m
      # OpenTelemetry Java agent exports traces, metrics, and logs to Grafana LGTM.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=airbnbSearcher
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=travelerinsider,deployment.environment=local
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_METRIC_EXPORT_INTERVAL=10000
      - OTEL_PROPAGATORS=tracecontext,baggage
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=true
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_LOG_ATTRIBUTES=true
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES=*
      - OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED=true
      - OTEL_JAVAAGENT_DEBUG=false
      - APP_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      grafana-lgtm:
        condition: service_started

  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: grafana-lgtm
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
      - "4317:4317"  # OTLP gRPC ingest
      - "4318:4318"  # OTLP HTTP ingest
    volumes:
      - grafana-data:/var/lib/grafana          # dashboards, users, orgs
      - tempo-data:/var/tempo                  # traces
      - loki-data:/var/loki                    # logs
      - mimir-data:/var/mimir                  # metrics
      - ./observability/prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/prometheus/prometheus.yaml:/otel-lgtm/prometheus/prometheus.yml:ro
      - ./observability/grafana/provisioning/dashboards/airbnb-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/airbnb-dashboards.yaml:ro
      - ./observability/grafana/provisioning/alerting/airbnb-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/airbnb-alerts.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/grafana/dashboards/airbnb:ro
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    name: app-net
    driver: bridge

volumes:
  postgres_data:
  elastic_data:
  grafana-data:
  loki-data:
  tempo-data:
  mimir-data:
