<!-- Hero / Header -->
<header class="bg-white border-b border-gray-100 sticky top-0 z-40 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center gap-6 py-4">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 flex-shrink-0">
        <svg class="w-8 h-8 text-rose-500" viewBox="0 0 32 32" fill="currentColor">
          <path d="M16 1C7.716 1 1 7.716 1 16s6.716 15 15 15 15-6.716 15-15S24.284 1 16 1zm0 5.5c2.485 0 4.5 2.015 4.5 4.5s-2.015 4.5-4.5 4.5-4.5-2.015-4.5-4.5 2.015-4.5 4.5-4.5zm0 21c-3.75 0-7.07-1.894-9.1-4.8.046-3.016 6.067-4.675 9.1-4.675s9.054 1.659 9.1 4.675C23.07 25.606 19.75 27.5 16 27.5z"/>
        </svg>
        <span class="text-xl font-bold text-gray-900 tracking-tight">stayfindr</span>
      </a>

      <!-- Search Bar -->
      <div class="flex-1 max-w-2xl">
        <app-search-bar (search)="onSearch($event)" (clear)="onClear()"></app-search-bar>
      </div>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <!-- Search results header -->
  <div *ngIf="searchQuery" class="mb-6 flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-gray-900">Results for "{{ searchQuery }}"</h2>
      <p class="text-sm text-gray-500 mt-1">{{ totalElements }} listings found</p>
    </div>
  </div>

  <!-- Default header when no search -->
  <div *ngIf="!searchQuery && !isLoading" class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Explore places to stay</h1>
    <p class="text-gray-500 mt-1">{{ totalElements.toLocaleString() }} listings available</p>
  </div>

  <!-- Error state -->
  <div *ngIf="error" class="mb-8 bg-red-50 border border-red-200 text-red-700 rounded-2xl p-6 flex items-start gap-4">
    <svg class="w-6 h-6 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <div>
      <p class="font-semibold">Connection Error</p>
      <p class="text-sm mt-1">{{ error }}</p>
    </div>
  </div>

  <!-- Loading Skeletons -->
  <div *ngIf="isLoading || isSearching" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div *ngFor="let s of skeletons" class="bg-white rounded-2xl overflow-hidden shadow-sm animate-pulse">
      <div class="aspect-[4/3] bg-gray-200"></div>
      <div class="p-4 space-y-3">
        <div class="h-3 bg-gray-200 rounded w-1/2"></div>
        <div class="h-4 bg-gray-200 rounded w-4/5"></div>
        <div class="h-3 bg-gray-200 rounded w-3/5"></div>
        <div class="h-4 bg-gray-200 rounded w-1/3"></div>
      </div>
    </div>
  </div>

  <!-- Listings Grid -->
  <div *ngIf="!isLoading && !isSearching && listings.length > 0"
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <app-listing-card *ngFor="let listing of listings" [listing]="listing"></app-listing-card>
  </div>

  <!-- Empty state -->
  <div *ngIf="!isLoading && !isSearching && listings.length === 0 && !error"
    class="flex flex-col items-center justify-center py-24 text-center">
    <div class="w-20 h-20 bg-rose-50 rounded-full flex items-center justify-center mb-6">
      <svg class="w-10 h-10 text-rose-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
    </div>
    <h3 class="text-xl font-bold text-gray-800 mb-2">No listings found</h3>
    <p class="text-gray-500 text-sm">Try searching with different keywords</p>
  </div>

  <!-- Pagination (only when not searching) -->
  <div *ngIf="!searchQuery && !isLoading && totalPages > 1" class="mt-10 flex items-center justify-center gap-2">
    <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 0"
      class="w-10 h-10 rounded-full flex items-center justify-center border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>

    <button *ngFor="let page of pageNumbers" (click)="goToPage(page)"
      [class]="page === currentPage
        ? 'w-10 h-10 rounded-full bg-rose-500 text-white font-semibold text-sm'
        : 'w-10 h-10 rounded-full border border-gray-200 text-gray-600 hover:bg-gray-50 text-sm transition-colors'">
      {{ page + 1 }}
    </button>

    <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages - 1"
      class="w-10 h-10 rounded-full flex items-center justify-center border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</main>
