<!-- Hero / Header -->
<header class="bg-white border-b border-gray-100 sticky top-0 z-[1001] shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center gap-6 py-4">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 flex-shrink-0">
        <svg class="w-8 h-8 text-rose-500" viewBox="0 0 32 32" fill="currentColor">
          <path d="M16 1C7.716 1 1 7.716 1 16s6.716 15 15 15 15-6.716 15-15S24.284 1 16 1zm0 5.5c2.485 0 4.5 2.015 4.5 4.5s-2.015 4.5-4.5 4.5-4.5-2.015-4.5-4.5 2.015-4.5 4.5-4.5zm0 21c-3.75 0-7.07-1.894-9.1-4.8.046-3.016 6.067-4.675 9.1-4.675s9.054 1.659 9.1 4.675C23.07 25.606 19.75 27.5 16 27.5z"/>
        </svg>
        <span class="text-xl font-bold text-gray-900 tracking-tight">stayfindr</span>
      </a>

      <!-- Search Bar -->
      <div class="flex-1 max-w-2xl">
        <app-search-bar (search)="onSearch($event)" (clear)="onClear()"></app-search-bar>
      </div>

      <!-- View Toggle -->
      <div class="hidden md:flex bg-gray-100 p-1 rounded-xl items-center">
        <button (click)="viewMode = 'grid'"
          [class]="viewMode === 'grid' ? 'bg-white shadow-sm' : 'text-gray-500'"
          class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-all">
          Grid
        </button>
        <button (click)="viewMode = 'map'"
          [class]="viewMode === 'map' ? 'bg-white shadow-sm' : 'text-gray-500'"
          class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-all">
          Map
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex flex-col lg:flex-row gap-8">

    <!-- Sidebar Filters -->
    <aside class="w-full lg:w-64 flex-shrink-0">
      <app-filter-sidebar (filterChange)="onFilterChange($event)"></app-filter-sidebar>
    </aside>

    <!-- Content Area -->
    <div class="flex-1 min-w-0">
      <!-- Header -->
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h2 *ngIf="searchQuery" class="text-2xl font-bold text-gray-900">Results for "{{ searchQuery }}"</h2>
          <h2 *ngIf="!searchQuery" class="text-2xl font-bold text-gray-900">Explore places to stay</h2>
          <p class="text-sm text-gray-500 mt-1">{{ totalElements | number }} listings found</p>
        </div>
      </div>

      <!-- Error state -->
      <div *ngIf="error" class="mb-8 bg-red-50 border border-red-200 text-red-700 rounded-2xl p-6 flex items-start gap-4">
        <svg class="w-6 h-6 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <div>
          <p class="font-semibold">Connection Error</p>
          <p class="text-sm mt-1">{{ error }}</p>
        </div>
      </div>

      <!-- Loading State -->
      <div *ngIf="isLoading || isSearching" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
        <div *ngFor="let s of skeletons" class="bg-white rounded-2xl overflow-hidden shadow-sm">
          <div class="aspect-[4/3] animate-ripple"></div>
          <div class="p-4 space-y-3 animate-pulse">
            <div class="h-3 bg-gray-200 rounded w-1/2"></div>
            <div class="h-4 bg-gray-200 rounded w-4/5"></div>
            <div class="h-3 bg-gray-200 rounded w-3/5"></div>
          </div>
        </div>
      </div>

      <!-- View Content -->
      <div *ngIf="!isLoading && !isSearching && listings.length > 0">
        <!-- Grid View -->
        <div *ngIf="viewMode === 'grid'" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
          <app-listing-card *ngFor="let listing of listings" [listing]="listing"></app-listing-card>
        </div>

        <!-- Map View -->
        <app-map-view *ngIf="viewMode === 'map'" [listings]="listings"></app-map-view>

        <!-- Pagination -->
        <div *ngIf="totalPages > 1" class="mt-10 flex items-center justify-center gap-2">
          <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 0"
            class="w-10 h-10 rounded-full flex items-center justify-center border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>

          <button *ngFor="let page of pageNumbers" (click)="goToPage(page)"
            [class]="page === currentPage
              ? 'w-10 h-10 rounded-full bg-rose-500 text-white font-semibold text-sm'
              : 'w-10 h-10 rounded-full border border-gray-200 text-gray-600 hover:bg-gray-50 text-sm transition-colors'">
            {{ page + 1 }}
          </button>

          <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages - 1"
            class="w-10 h-10 rounded-full flex items-center justify-center border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Empty State -->
      <app-empty-state *ngIf="!isLoading && !isSearching && listings.length === 0 && !error"
        (reset)="onClear()"></app-empty-state>

    </div>
  </div>
</main>
