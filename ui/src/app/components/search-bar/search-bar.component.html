<div class="relative w-full">
  <div class="flex items-center bg-white rounded-full shadow-md border border-gray-200 overflow-visible transition-shadow hover:shadow-lg focus-within:shadow-lg focus-within:border-gray-300">
    <!-- Search icon -->
    <div class="pl-5 pr-2 text-gray-400 flex-shrink-0">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
      </svg>
    </div>

    <!-- Input -->
    <input
      type="text"
      [(ngModel)]="query"
      (input)="onInput()"
      (keyup.enter)="onSearch()"
      (keydown)="onKeydown($event)"
      (blur)="onBlur()"
      placeholder="Search destinations, property types…"
      class="flex-1 py-3.5 px-2 bg-transparent outline-none text-gray-800 text-sm font-medium placeholder-gray-400"
    />

    <!-- Clear button -->
    <button *ngIf="query" (click)="clearSearch()"
      class="px-3 text-gray-400 hover:text-gray-600 transition-colors flex-shrink-0">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <!-- Search button -->
    <button (click)="onSearch()"
      class="m-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-full px-5 py-2.5 text-sm font-semibold transition-all active:scale-95 flex-shrink-0">
      Search
    </button>
  </div>

  <!-- Autocomplete dropdown -->
  <div *ngIf="showSuggestions"
    class="absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden z-50">
    <ul>
      <li *ngFor="let s of suggestions"
        (mousedown)="selectSuggestion(s)"
        class="flex items-center gap-3 px-5 py-3 hover:bg-gray-50 cursor-pointer transition-colors">
        <span class="w-7 h-7 rounded-full bg-rose-50 text-rose-400 flex items-center justify-center flex-shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </span>
        <span class="text-sm text-gray-700 font-medium">{{ s.name }}</span>
      </li>
    </ul>
  </div>
</div>
